[project]
name = "mesh-backend"
version = "1.0.0"
description = "Mesh Orchestration API Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "mesh @ git+https://github.com/rscheiwe/mesh.git@main",
    "openai>=1.59.8",
    "anthropic>=0.43.3",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
